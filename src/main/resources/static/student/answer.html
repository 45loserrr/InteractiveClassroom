  <div class="card">

      <p class="muted">还没有题目</p>

  function selectOption(letter, btn) {
    chooseOption = letter;
    var buttons = document.querySelectorAll('#optionBox .btn');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.remove('btn-primary');
    }
    btn.classList.add('btn-primary');
    document.getElementById('result').innerText = '选了 ' + letter;
  }
