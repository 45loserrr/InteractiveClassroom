  <h1 class="page-title">数据导出</h1>
  <p class="page-desc">按课堂导出 CSV，Excel 直接打开。</p>

  <div class="card">
    <div class="form-row">
      <label for="classroomId">课堂 ID</label>
      <input class="input" id="classroomId" type="number" placeholder="比如：1">
    </div>

    <button class="btn btn-primary" onclick="exportReport()">导出 CSV</button>
  </div>

    <h2>数据预览</h2>

        <th>账号</th>

        <th>签到时间</th>
        <th>题目</th>
        <th>选择</th>
        <th>是否正确</th>
      </tr>
      </thead>
      <tbody id="tbody">
      <tr>
        <td colspan="6" class="muted">导出后 Excel 里就是这几列</td>
      </tr>
      </tbody>
    </table>
  </div>

  <p class="muted">M3：后端 ReportController 返回 CSV，前端用 fetch 拿 blob 下载，别用 &lt;a href&gt;。</p>
</div>

<script src="/js/common.js"></script>
