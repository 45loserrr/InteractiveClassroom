<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 移动互动课堂</title>
  <link rel="stylesheet" href="/css/common.css">
</head>
<body class="center-page">

<div class="login-card">
  <h1>移动互动课堂</h1>
  <p class="subtitle">登录后开始上课</p>

  <form onsubmit="login(); return false;">
    <div class="form-row">
      <label for="username">账号</label>
      <input class="input" id="username" type="text" placeholder="请输入账号" autocomplete="username">
    </div>

    <div class="form-row">
      <label for="password">密码</label>
      <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>

    <button class="btn btn-primary btn-block" type="submit">登 录</button>
  </form>

  <div class="bottom-link">还没有账号？<a href="/register.html">去注册</a></div>
</div>

<script src="/js/common.js"></script>
<script>
  async function login() {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;

    if (!username || !password) {
      alert('账号和密码都要填');
      return;
    }

    var res = await myFetch('/api/auth/login', 'POST', {
      username: username,
      password: password
    });

    if (res.code === 200) {
      // 登录成功：token、角色、姓名都存起来，后面的页面直接读
      localStorage.setItem('token', res.data.token);
      localStorage.setItem('role', res.data.role);
      localStorage.setItem('realName', res.data.realName || res.data.username);
      localStorage.setItem('userId', res.data.id);

      // 老师去教师端，学生去学生端
      if (res.data.role === 'teacher') {
        location.href = '/teacher/';
      } else {
        location.href = '/student/';
      }
    }
  }
</script>

</body>
</html>
