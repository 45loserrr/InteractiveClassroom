<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 移动互动课堂</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    .card {
      width: 360px;
      background: #fff;
      padding: 36px 32px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      text-align: center;
      color: #1e3a8a;
    }
    .subtitle {
      margin: 0 0 26px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #374151;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 18px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #2563eb; }
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .tip {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }
    .tip a { color: #2563eb; text-decoration: none; }
    .demo {
      margin-top: 14px;
      padding: 10px;
      background: #f9fafb;
      border-radius: 8px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.7;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>移动互动课堂</h1>
  <p class="subtitle">登录后开始上课</p>

  <form onsubmit="login(); return false;">
    <label for="username">账号</label>
    <input id="username" type="text" placeholder="请输入账号" autocomplete="username">

    <label for="password">密码</label>
    <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">

    <button type="submit">登 录</button>
  </form>

  <div class="tip">还没有账号？<a href="/register.html">去注册</a></div>

  <div class="demo">
    测试账号（密码都是 123456）<br>
    老师：teacher　学生：stu01 / stu02 / stu03
  </div>
</div>

<script src="/js/common.js"></script>
<script>
  async function login() {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;

    if (!username || !password) {
      alert('账号和密码都要填');
      return;
    }

    var res = await myFetch('/api/auth/login', 'POST', {
      username: username,
      password: password
    });

    if (res.code === 200) {
      // 登录成功：把后端发的 token 和角色存起来
      localStorage.setItem('token', res.data.token);
      localStorage.setItem('role', res.data.role);
      localStorage.setItem('realName', res.data.realName || res.data.username);
      localStorage.setItem('userId', res.data.id);

      // 跳到中转页，由中转页按角色显示菜单
      location.href = '/index.html';
    }
  }
</script>

</body>
</html>
