<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课堂大屏 - 移动互动课堂</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .screen {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 24px 40px;
    }

    .head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
    }

    .head h1 {
      margin: 0;
      font-size: 30px;
    }

    .head .sub {
      margin-top: 6px;
      color: #94a3b8;
      font-size: 15px;
    }

    .head .back {
      color: #93c5fd;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 24px;
    }

    .stat {
      background: #1e293b;
      border-radius: 8px;
      padding: 22px;
      text-align: center;
    }

    .stat .num {
      color: #38bdf8;
      font-size: 52px;
      font-weight: bold;
      line-height: 1.2;
    }

    .stat .label {
      margin-top: 6px;
      color: #94a3b8;
    }

    .panel {
      margin-top: 24px;
      background: #1e293b;
      border-radius: 8px;
      padding: 22px;
    }

    .panel h2 {
      margin: 0 0 18px;
      font-size: 18px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .bar-label {
      width: 20px;
      color: #93c5fd;
      font-weight: bold;
    }

    .bar-track {
      flex: 1;
      height: 24px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      background: #38bdf8;
    }

    .bar-count {
      width: 30px;
      text-align: right;
      color: #cbd5e1;
    }

    @media (max-width: 700px) {
      .stats { grid-template-columns: 1fr; }
      .head h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

<div class="screen">
  <div class="head">
    <div>
      <h1>课堂大屏</h1>
      <div class="sub" id="classroomName">课堂：未选择</div>
    </div>
    <a class="back" href="javascript:history.back()">返回</a>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="num" id="checkinCount">0</div>
      <div class="label">已签到</div>
    </div>
    <div class="stat">
      <div class="num" id="answerCount">0</div>
      <div class="label">已答题</div>
    </div>
    <div class="stat">
      <div class="num" id="studentCount">0</div>
      <div class="label">学生总数</div>
    </div>
  </div>

  <div class="panel">
    <h2>选项分布</h2>

    <div class="bar-row">
      <span class="bar-label">A</span>
      <div class="bar-track"><div class="bar-fill" id="barA"></div></div>
      <span class="bar-count" id="countA">0</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">B</span>
      <div class="bar-track"><div class="bar-fill" id="barB"></div></div>
      <span class="bar-count" id="countB">0</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">C</span>
      <div class="bar-track"><div class="bar-fill" id="barC"></div></div>
      <span class="bar-count" id="countC">0</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">D</span>
      <div class="bar-track"><div class="bar-fill" id="barD"></div></div>
      <span class="bar-count" id="countD">0</span>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var classroomId = Number(params.get('classroomId') || 0);
  if (classroomId) {
    document.getElementById('classroomName').innerText = '课堂 ID：' + classroomId;
  }

  }

  // 每 3 秒刷新一次
  // setInterval(refreshStats, 3000);
</script>

</body>
</html>
