<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 移动互动课堂</title>
  <link rel="stylesheet" href="/css/common.css">
</head>
<body class="center-page">

<div class="login-card" style="width: 420px;">
  <h1>注册新账号</h1>
  <p class="subtitle">注册完就能直接登录</p>

  <form onsubmit="register(); return false;">
    <div class="form-row">
      <label for="username">账号</label>
      <input class="input" id="username" type="text" placeholder="字母或数字，例如 stu04">
    </div>

    <div class="form-row">
      <label for="password">密码</label>
      <input class="input" id="password" type="password" placeholder="至少 6 位">
    </div>

    <div class="form-row">
      <label for="realName">真实姓名</label>
      <input class="input" id="realName" type="text" placeholder="例如 赵六">
    </div>

    <div class="form-row">
      <label for="role">角色</label>
      <select class="input" id="role">
        <option value="student">学生</option>
        <option value="teacher">老师</option>
      </select>
    </div>

    <button class="btn btn-primary btn-block" type="submit">注 册</button>
  </form>

  <div class="bottom-link">已经有账号了？<a href="/index.html">去登录</a></div>
</div>

<script src="/js/common.js"></script>
<script>
  async function register() {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    var realName = document.getElementById('realName').value.trim();
    var role = document.getElementById('role').value;

    if (!username || !password) {
      alert('账号和密码都要填');
      return;
    }
    if (password.length < 6) {
      alert('密码至少 6 位');
      return;
    }

    var res = await myFetch('/api/auth/register', 'POST', {
      username: username,
      password: password,
      realName: realName,
      role: role
    });

    if (res.code === 200) {
      alert('注册成功，去登录吧');
      location.href = '/index.html';
    }
  }
</script>

</body>
</html>
